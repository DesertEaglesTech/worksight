<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Worksight cover</title>
<!-- Source of submission/worksight-cover.png (1280×720), matching the Slides deck cover.

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=DM+Sans:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; background: #f5f4f0; overflow: hidden; }
  body { font-family: "DM Sans", Arial, sans-serif; color: #1b1d20; position: relative; }
  img { position: absolute; left: 600px; top: 0; width: 680px; height: 720px; object-fit: cover; }
  .text { position: absolute; left: 80px; top: 0; width: 460px; height: 720px; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
  .eyebrow { font-size: 15px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: #b44606; line-height: 1.5; }
  h1 { font-family: "Space Grotesk", Arial, sans-serif; font-size: 84px; line-height: 1; letter-spacing: -1.5px; }
  .tag { font-size: 30px; line-height: 1.25; }
  .meta { font-size: 16px; line-height: 1.5; color: #4e5560; }
</style>
</head>
<body>
  <img src="factory.jpg" alt="">
  <div class="text">
    <div class="eyebrow">AMD Developer Hackathon · ACT III<br>Intelligent Industry</div>
    <h1>Worksight</h1>
    <div class="tag">Find defects on a new part from good photos only</div>
    <div class="meta">Gemma on AMD Token Factory<br>Team Desert Eagles</div>
  </div>
