<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Worksight cover</title>
<!-- Source of submission/worksight-cover.png (1280×720). Rebuild: bash submission/pitch/build.sh -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; background: #1f2f2b; overflow: hidden; }
  body { font-family: "Inter", "DejaVu Sans", sans-serif; color: #f3f6f4; display: flex; align-items: center; gap: 56px; padding: 0 64px 0 80px; }
  .text { flex: 1; }
  .logo { font-size: 112px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .sub { font-size: 34px; color: #cdef9a; margin-top: 28px; line-height: 1.25; }
  .tags { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 10px; }
  .tags span { font-size: 18px; padding: 7px 16px; border-radius: 99px; border: 1px solid #3a524c; color: #b5c4bf; }
  .tags span.on { background: #cdef9a; color: #1f2f2b; border-color: #cdef9a; font-weight: 600; }
  .images { width: 540px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .images figure { position: relative; }
  .images img { width: 100%; height: 520px; object-fit: cover; border-radius: 12px; display: block; }
  .images figcaption { position: absolute; left: 12px; bottom: 12px; font-size: 15px; font-weight: 600; padding: 5px 12px; border-radius: 99px; background: rgba(31,47,43,.85); }
  .pass { color: #cdef9a; } .fail { color: #f29a8a; }
</style>
</head>
<body>
  <div class="text">
    <div class="logo">worksight.</div>
    <div class="sub">Few-shot visual inspection<br>for quality engineers</div>
    <div class="tags"><span class="on">Gemma on AMD</span><span>Intelligent Industry</span><span>No training</span><span>Human in the loop</span></div>
  </div>
  <div class="images">
    <figure><img src="../../web/public/examples/visa-pcb1-normal-0011.jpg" alt=""><figcaption class="pass">Good board</figcaption></figure>
    <figure><img src="../../web/public/examples/visa-pcb1-bent-014.jpg" alt=""><figcaption class="fail">Bent pins</figcaption></figure>
  </div>
</body>
</html>
