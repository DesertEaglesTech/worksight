<!doctype html>
<html><head><meta charset="utf-8"><title>Worksight Showreel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+JP:wght@700&family=Noto+Sans+SC:wght@700&family=Noto+Sans+Devanagari:wght@700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#0B0D11;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, BEAT = 0.5, BAR = 2;
const c = document.getElementById("c"), x = c.getContext("2d");
const C = { bg: "#0B0D11", panel: "#151920", line: "#262B35", ink: "#F3F0E8", muted: "#8A919C",
  orange: "#FF6B1A", blue: "#4C7DFF", green: "#3DDC97", red: "#FF4D5E", yellow: "#FFC24B", amd: "#ED1C24" };
const SANS = "'Space Grotesk', Inter, sans-serif", MONO = "'JetBrains Mono', monospace";
const CJK = "'Space Grotesk', 'Noto Sans SC', 'Noto Sans JP', 'Noto Sans Devanagari', sans-serif";

// ---------- assets ----------
const names = ["part", "overlay", "heat", "ref", "app-top", "app-result", "app-ai"];
for (let i = 0; i < 20; i++) names.push("good" + String(i).padStart(2, "0"));
const IM = {};
window.ready = Promise.all([
  ...names.map(n => new Promise(r => { const i = new Image(); i.onload = () => r(); i.onerror = () => r(); i.src = "assets/" + n + ".png"; IM[n] = i; })),
  document.fonts.load("700 80px 'Space Grotesk'"), document.fonts.load("400 30px 'Space Grotesk'"),
  document.fonts.load("500 30px 'Space Grotesk'"), document.fonts.load("400 20px 'JetBrains Mono'"),
  document.fonts.load("700 20px 'JetBrains Mono'"), document.fonts.load("700 60px 'Noto Sans SC'", "检测"),
  document.fonts.load("700 60px 'Noto Sans JP'", "検査"), document.fonts.load("700 60px 'Noto Sans Devanagari'", "निरीक्षण"),
]).then(() => document.fonts.ready);

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eIO = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const s = 1.70158; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
function rand(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function inOut(t, a, b, fi = 0.6, fo = 0.6) { return Math.min(eOut(P(t, a, a + fi)), 1 - eIO(P(t, b - fo, b))); }
function font(size, weight = 700, fam = SANS) { x.font = `${weight} ${size}px ${fam}`; }
function text(s, X, Y, size, o = {}) {
  x.save(); font(size, o.w ?? 700, o.fam ?? SANS); x.fillStyle = o.c ?? C.ink; x.globalAlpha *= o.a ?? 1;
  x.textAlign = o.align ?? "left"; x.textBaseline = o.base ?? "alphabetic"; x.letterSpacing = (o.ls ?? 0) + "px";
  x.fillText(s, X, Y); const w = x.measureText(s).width; x.restore(); return w;
}
function measure(s, size, w = 700, fam = SANS, ls = 0) { x.save(); font(size, w, fam); x.letterSpacing = ls + "px"; const m = x.measureText(s).width; x.restore(); return m; }
// words rise in one after another from behind a mask line
function riseWords(s, X, Y, size, t0, t, o = {}) {
  const words = s.split(" "); let cx = X; const step = o.step ?? 0.08; const total = measure(s, size, o.w ?? 700);
  if (o.align === "center") cx = X - total / 2;
  words.forEach((wd, i) => {
    const k = eExpo(P(t, t0 + i * step, t0 + i * step + 0.7));
    x.save(); x.beginPath(); x.rect(cx - 10, Y - size * 1.05, measure(wd, size, o.w ?? 700) + 30, size * 1.35); x.clip();
    text(wd, cx, Y + (1 - k) * size * 1.2, size, { ...o, align: "left", a: (o.a ?? 1) * k });
    x.restore(); cx += measure(wd + " ", size, o.w ?? 700);
  });
}
function typeText(s, X, Y, size, k, o = {}) { const n = Math.floor(s.length * clamp(k)); text(s.slice(0, n), X, Y, size, o); return n < s.length; }
function rr(X, Y, w, h, r, fill, stroke, lw = 2) {
  x.beginPath(); x.roundRect(X, Y, w, h, r); if (fill) { x.fillStyle = fill; x.fill(); } if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw; x.stroke(); }
}
function img(n, X, Y, w, h, a = 1) { const i = IM[n]; if (!i || !i.width) return; x.save(); x.globalAlpha *= a; x.drawImage(i, X, Y, w, h); x.restore(); }
function imgFit(n, X, Y, w, h, a = 1) { const i = IM[n]; if (!i || !i.width) return [X, Y, w, h]; const s = Math.min(w / i.width, h / i.height); const iw = i.width * s, ih = i.height * s; img(n, X + (w - iw) / 2, Y + (h - ih) / 2, iw, ih, a); return [X + (w - iw) / 2, Y + (h - ih) / 2, iw, ih]; }
function chip(s, X, Y, o = {}) {
  const size = o.size ?? 24; const w = measure(s, size, 500, o.fam ?? SANS) + size * 1.4; const h = size * 1.9;
  x.save(); x.globalAlpha *= o.a ?? 1; rr(X, Y, w, h, h / 2, o.fill ?? "transparent", o.stroke ?? C.line, 2);
  if (o.dot) { x.beginPath(); x.arc(X + size * 0.75, Y + h / 2, size * 0.22, 0, 7); x.fillStyle = o.dot; x.fill(); }
  text(s, X + size * (o.dot ? 1.2 : 0.7), Y + h / 2 + size * 0.36, size, { w: 500, c: o.c ?? C.ink, fam: o.fam });
  x.restore(); return w;
}
function counter(v, digits = 0) { return v.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits }); }
function kickPulse(t) {
  const bar = Math.floor(t / BAR);
  const on = (bar >= 8 && bar < 56) || (bar >= 64 && bar < 96) || (bar >= 104 && bar < 144);
  return on ? Math.exp(-(t % BEAT) * 9) : 0;
}

// ---------- persistent layers ----------
function background(t) {
  x.fillStyle = C.bg; x.fillRect(0, 0, W, H);
  const pulse = kickPulse(t);
  x.save(); x.globalAlpha = 0.5;
  const g = 48, off = (t * 12) % g;
  for (let gx = -g; gx < W + g; gx += g) for (let gy = -g; gy < H + g; gy += g) {
    const px = gx + off, py = gy + off * 0.5; const d = Math.hypot(px - W / 2, py - H / 2) / 1100;
    x.fillStyle = `rgba(243,240,232,${0.07 * (1 - d) + pulse * 0.04})`; x.fillRect(px, py, 2, 2);
  }
  x.restore();
  const v = x.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1200); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.55)");
  x.fillStyle = v; x.fillRect(0, 0, W, H);
}
const SCENES = [
  [0, 16, "Intro"], [16, 48, "The problem"], [48, 80, "The insight"], [80, 112, "How it works"], [112, 128, "Closest reference"],
  [128, 160, "Gemma on AMD"], [160, 192, "The product"], [192, 208, "The engineer decides"], [208, 240, "Benchmarks"],
  [240, 256, "The code"], [256, 272, "Tech stack"], [272, 288, "Market and roadmap"], [288, 300, "Worksight"],
];
function hud(t) {
  if (t < 3 || t > 297) return;
  const a = Math.min(P(t, 3, 4), 1 - P(t, 296, 297));
  x.save(); x.globalAlpha = a * 0.85;
  text("WORKSIGHT", 72, 70, 18, { w: 700, ls: 6 });
  text("SHOWREEL · DESERT EAGLES · 2026", 230, 70, 18, { w: 400, c: C.muted, ls: 3 });
  const i = SCENES.findIndex(s => t >= s[0] && t < s[1]); const s = SCENES[Math.max(0, i)];
  text(`${String(i + 1).padStart(2, "0")} / ${SCENES.length}   ${s[2].toUpperCase()}`, W - 72, 70, 18, { w: 500, align: "right", ls: 3, c: C.muted });
  const f = Math.floor(t * 30) % 30, sec = Math.floor(t);
  text(`TC ${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}:${String(f).padStart(2, "0")}`, 72, H - 56, 16, { w: 400, fam: MONO, c: C.muted });
  text(`${Math.floor(t / BAR) + 1}.${Math.floor((t % BAR) / BEAT) + 1}  ·  120 BPM`, W - 72, H - 56, 16, { w: 400, fam: MONO, c: C.muted, align: "right" });
  x.fillStyle = C.line; x.fillRect(260, H - 62, W - 520, 2);
  x.fillStyle = C.orange; x.fillRect(260, H - 62, (W - 520) * (t / 300), 2);
  for (const [a0] of SCENES) { x.fillStyle = C.muted; x.fillRect(260 + (W - 520) * (a0 / 300), H - 66, 2, 10); }
  x.restore();
}
function wipes(t) {
  for (const [a0] of SCENES.slice(1)) {
    const k = P(t, a0 - 0.45, a0 + 0.45); if (k <= 0 || k >= 1) continue;
    const e = eIO(k); const w = W * 0.55;
    x.save(); x.fillStyle = C.orange; x.beginPath();
    const xs = lerp(-w - 400, W + 400, e);
    x.moveTo(xs, 0); x.lineTo(xs + w, 0); x.lineTo(xs + w - 300, H); x.lineTo(xs - 300, H); x.fill();
    x.fillStyle = C.ink; x.fillRect(xs + w + 20, 0, 14, H);
    x.restore();
  }
}

// ---------- scenes ----------
function sIntro(t) {
  const lineW = eExpo(P(t, 0.6, 2.4)) * 1300;
  const fadeLine = 1 - P(t, 4.2, 5.2);
  x.fillStyle = C.orange; x.globalAlpha = fadeLine;
  x.fillRect(W / 2 - lineW / 2, H / 2 - 2, lineW, 4); x.globalAlpha = 1;
  if (t < 2.4) { x.beginPath(); x.arc(W / 2, H / 2, 6 + 30 * (1 - P(t, 0.2, 0.8)), 0, 7); x.fillStyle = C.orange; x.globalAlpha = P(t, 0, 0.3); x.fill(); x.globalAlpha = 1; }
  // inspection grid opening from the line
  const gk = eOut(P(t, 2.2, 4.4)), ga = Math.min(gk, 1 - P(t, 7, 9));
  if (ga > 0) {
    x.save(); x.strokeStyle = "rgba(255,107,26,0.35)"; x.lineWidth = 1; x.globalAlpha = ga;
    for (let i = -12; i <= 12; i++) { const yy = H / 2 + i * 40 * gk; x.beginPath(); x.moveTo(W / 2 - 650, yy); x.lineTo(W / 2 + 650, yy); x.stroke(); }
    for (let i = -16; i <= 16; i++) { const xx = W / 2 + i * 40; x.beginPath(); x.moveTo(xx, H / 2 - 480 * gk); x.lineTo(xx, H / 2 + 480 * gk); x.stroke(); }
    x.restore();
  }
  // wordmark
  const word = "WORKSIGHT", size = 230; const total = measure(word, size, 700, SANS, -6);
  let cx = W / 2 - total / 2; const by = H / 2 + 80; const outA = 1 - eIO(P(t, 14.6, 16));
  for (let i = 0; i < word.length; i++) {
    const k = eExpo(P(t, 4 + i * 0.09, 5.2 + i * 0.09)); const cw = measure(word[i], size, 700, SANS, -6);
    x.save(); x.beginPath(); x.rect(cx - 5, by - size, cw + 10, size * 1.08); x.clip();
    text(word[i], cx, by + (1 - k) * size, size, { ls: -6, a: outA });
    x.restore(); cx += cw;
  }
  // scanner over the wordmark finds one "anomaly"
  const sk = P(t, 6.2, 8.6);
  if (sk > 0 && sk < 1) {
    const sx = lerp(W / 2 - total / 2 - 40, W / 2 + total / 2 + 40, eIO(sk));
    const gr = x.createLinearGradient(sx - 140, 0, sx, 0); gr.addColorStop(0, "rgba(255,107,26,0)"); gr.addColorStop(1, "rgba(255,107,26,0.45)");
    x.fillStyle = gr; x.fillRect(sx - 140, by - size - 10, 140, size + 40); x.fillStyle = C.orange; x.fillRect(sx, by - size - 30, 3, size + 80);
  }
  const hk = P(t, 7.4, 8.4);
  if (hk > 0) {
    const sx = W / 2 - total / 2 + measure("WORK", size, 700, SANS, -6) + measure("S", size, 700, SANS, -6) / 2;
    const r = 120 + 12 * Math.sin(t * 6); const gl = x.createRadialGradient(sx, by - size / 2.6, 0, sx, by - size / 2.6, r);
    gl.addColorStop(0, `rgba(255,77,94,${0.55 * eOut(hk) * outA})`); gl.addColorStop(1, "rgba(255,77,94,0)");
    x.fillStyle = gl; x.fillRect(sx - r, by - size / 2.6 - r, r * 2, r * 2);
  }
  const sub = "Find defects on a new part from good photos only.";
  typeText(sub, W / 2 - measure(sub, 40, 400) / 2, by + 110, 40, P(t, 8.8, 11.2), { w: 400, c: C.muted, a: outA });
  const ck = eBack(P(t, 11.4, 12.2));
  if (ck > 0) {
    x.save(); x.globalAlpha = clamp(ck) * outA;
    const w1 = measure("AMD Developer Hackathon · ACT III", 24, 500) + 34, w2 = measure("Intelligent Industry", 24, 500) + 34, w3 = measure("Team Desert Eagles", 24, 500) + 34;
    let sx = W / 2 - (w1 + w2 + w3 + 32) / 2; const yy = by + 160 + (1 - clamp(ck)) * 30;
    sx += chip("AMD Developer Hackathon · ACT III", sx, yy, { stroke: C.amd }) + 16;
    sx += chip("Intelligent Industry", sx, yy) + 16; chip("Team Desert Eagles", sx, yy, { stroke: C.orange });
    x.restore();
  }
}
function part(X, Y, w, h, bad, glow) {
  rr(X, Y, w, h, 10, "#1B3A5C", bad ? C.red : "#2E5B8A", bad ? 3 : 2);
  x.fillStyle = "#C9D3DE"; x.beginPath(); x.arc(X + w * 0.28, Y + h * 0.45, h * 0.26, 0, 7); x.arc(X + w * 0.72, Y + h * 0.45, h * 0.26, 0, 7); x.fill();
  x.fillStyle = "#1B3A5C"; x.beginPath(); x.arc(X + w * 0.28, Y + h * 0.45, h * 0.18, 0, 7); x.arc(X + w * 0.72, Y + h * 0.45, h * 0.18, 0, 7); x.fill();
  x.strokeStyle = "#C9D3DE"; x.lineWidth = 3;
  for (let i = 0; i < 4; i++) { const px = X + w * (0.38 + i * 0.08); x.beginPath(); x.moveTo(px, Y + h); x.lineTo(px + (bad && i < 2 ? -10 + i * 4 : 0), Y + h + h * 0.25); x.stroke(); }
  if (glow) { const g = x.createRadialGradient(X + w * 0.45, Y + h, 0, X + w * 0.45, Y + h, w * 0.6); g.addColorStop(0, `rgba(255,77,94,${0.6 * glow})`); g.addColorStop(1, "rgba(255,77,94,0)"); x.fillStyle = g; x.fillRect(X - w, Y - h, w * 3, h * 3); }
}
function sProblem(t) {
  const u = t - 16, a = inOut(t, 16, 48);
  x.save(); x.globalAlpha = a;
  if (u < 16) {
    riseWords("A new part arrives", 160, 300, 110, 16.3, t);
    riseWords("on the line.", 160, 420, 110, 16.7, t, { c: C.muted });
    // conveyor
    const belt = 760; x.fillStyle = C.panel; x.fillRect(0, belt + 120, W, 16);
    for (let i = 0; i < 14; i++) {
      const px = ((i * 260 - u * 160) % (14 * 260) + 14 * 260) % (14 * 260) - 260;
      const bad = i === 6 && u > 8; part(px, belt, 190, 100, bad, bad ? 0.6 + 0.4 * Math.sin(t * 8) : 0);
    }
    if (u > 8) {
      riseWords("Defects are rare.", 160, 600, 70, 24.2, t, { c: C.red });
      const n = Math.floor(lerp(0, 1000, eOut(P(t, 24.4, 27.5))));
      text(`1 in ${counter(n)}`, W - 160, 600, 70, { align: "right", c: C.ink, a: P(t, 24.4, 25) });
    }
  } else {
    // a model wants hundreds of labelled defects
    const k = 1 - P(t, 47, 48);
    riseWords("A typical model needs hundreds", 160, 250, 76, 32.2, t, { a: k });
    riseWords("of labelled defects.", 160, 340, 76, 32.6, t, { c: C.muted, a: k });
    const cols = 30, rows = 10, s = 30, gx = 160, gy = 420;
    for (let i = 0; i < cols * rows; i++) {
      const cx = gx + (i % cols) * (s + 8), cy = gy + Math.floor(i / cols) * (s + 8);
      const show = P(t, 33 + i * 0.012, 33.4 + i * 0.012);
      const found = rand(i) < 0.012 * clamp((t - 35) / 4);
      x.globalAlpha = a * show * k; rr(cx, cy, s, s, 5, found ? C.red : C.panel, found ? null : C.line, 1);
    }
    x.globalAlpha = a * k;
    const found = Math.round(300 * 0.012 * clamp((t - 35) / 4) * 0.9);
    text(`labelled defects collected: ${found} / 300`, 160, 860, 30, { w: 500, fam: MONO, c: C.muted, a: P(t, 35, 36) });
    // weeks of labelling
    const wk = eOut(P(t, 40, 44));
    x.globalAlpha = a * k * P(t, 40, 40.5);
    for (let i = 0; i < 6; i++) { rr(1340 + i * 70, 860 - 26, 60, 34, 6, i < wk * 6 ? C.orange : "transparent", C.line, 2); }
    text("weeks of labelling", 1340, 820, 26, { w: 500, c: C.muted });
    const sk = eBack(P(t, 44.5, 45.3));
    if (sk > 0) {
      x.save(); x.translate(W / 2, 960); x.rotate(-0.04); x.scale(clamp(sk, 0, 1.2), clamp(sk, 0, 1.2));
      rr(-430, -60, 860, 90, 8, C.red); text("Every new part starts again.", 0, 4, 44, { align: "center", c: "#fff" }); x.restore();
    }
  }
  x.restore();
}
function sInsight(t) {
  const a = inOut(t, 48, 80); x.save(); x.globalAlpha = a;
  const qa = 1 - eIO(P(t, 55.2, 56.2));
  riseWords("What if you only needed", W / 2, 470, 96, 48.4, t, { align: "center", a: qa });
  riseWords("good photos?", W / 2, 600, 120, 49.1, t, { align: "center", c: C.green, a: qa });
  if (t > 55.5) {
    const merge = eIO(P(t, 67.5, 70));
    const cols = 5, cw = 220, ch = 165, gx = W / 2 - (cols * (cw + 14)) / 2, gy = 150;
    for (let i = 0; i < 20; i++) {
      const k = eExpo(P(t, 56 + i * 0.28, 57 + i * 0.28));
      const tx = gx + (i % cols) * (cw + 14), ty = gy + Math.floor(i / cols) * (ch + 14);
      const sx = rand(i + 3) * W, sy = rand(i + 9) * H - 300;
      const fx = lerp(lerp(sx, tx, k), W / 2 - 260 + i * 3, merge), fy = lerp(lerp(sy, ty, k), 330 + i * 3, merge);
      const fw = lerp(cw, 520, merge), fh = lerp(ch, 396, merge);
      x.save(); x.globalAlpha = a * clamp(k * 2) * (merge > 0.95 && i < 19 ? 0 : 1); x.translate(fx + fw / 2, fy + fh / 2); x.rotate((1 - k) * (rand(i) - 0.5) * 1.2);
      img("good" + String(i).padStart(2, "0"), -fw / 2, -fh / 2, fw, fh); x.strokeStyle = C.green; x.lineWidth = 2; x.strokeRect(-fw / 2, -fh / 2, fw, fh); x.restore();
    }
    const n = Math.min(20, Math.floor(P(t, 56, 62) * 21));
    x.globalAlpha = a * (1 - merge);
    text(`${n}`, 160, 980, 120, { c: C.green }); text("good photos · no defect labels", 160 + measure(`${n}`, 120) + 30, 965, 36, { w: 500, c: C.muted });
    if (merge > 0) {
      x.globalAlpha = a * eOut(P(t, 69, 70.5));
      rr(W / 2 + 300, 330, 560, 396, 18, C.panel, C.green, 2);
      text("PROFILE", W / 2 + 340, 390, 22, { w: 500, ls: 6, c: C.green });
      text("Ultrasonic sensor board", W / 2 + 340, 445, 40); text("VisA pcb1 · version 1", W / 2 + 340, 490, 26, { w: 400, c: C.muted });
      const rows = [["Good photos", "20"], ["Build time", `${(lerp(0, 8.7, eOut(P(t, 70, 73)))).toFixed(1)} s`], ["Defect labels", "0"], ["Training", "none"]];
      rows.forEach(([k, v], i) => { const yy = 560 + i * 44; x.globalAlpha = a * P(t, 70 + i * 0.3, 70.6 + i * 0.3); text(k, W / 2 + 340, yy, 26, { w: 400, c: C.muted }); text(v, W / 2 + 820, yy, 26, { align: "right" }); });
      x.globalAlpha = a * P(t, 73, 74); riseWords("A profile in seconds. Not a training run.", W / 2, 880, 54, 73, t, { align: "center" });
    }
  }
  x.restore();
}
function sHow(t) {
  const a = inOut(t, 80, 112); x.save(); x.globalAlpha = a; const pulse = kickPulse(t);
  const IX = 150, IY = 220, IW = 820, IH = 625;
  const step = t < 86 ? 0 : t < 94 ? 1 : t < 100 ? 2 : 3;
  const labels = ["01 · LOOK", "02 · FEATURES", "03 · NEAREST GOOD PATCH", "04 · SCORE"];
  labels.forEach((l, i) => chip(l, 150 + i * 290, 150, { size: 20, stroke: i === step ? C.orange : C.line, c: i <= step ? C.ink : C.muted, a: P(t, 80.3 + i * 0.1, 80.8 + i * 0.1) }));
  const ik = eExpo(P(t, 80.4, 81.6));
  x.save(); x.translate((1 - ik) * -300, 0); x.globalAlpha = a * ik;
  img("part", IX, IY, IW, IH);
  // patch grid scan
  const gk = P(t, 86, 92); const gx = 24, gy = 18;
  if (t > 86) {
    for (let j = 0; j < gy; j++) for (let i = 0; i < gx; i++) {
      const idx = j * gx + i, on = idx / (gx * gy) < gk; if (!on) continue;
      const age = gk - idx / (gx * gy);
      x.strokeStyle = `rgba(76,125,255,${clamp(0.9 - age * 3, 0.15, 0.9) * (1 - P(t, 99, 100.5))})`; x.lineWidth = 1;
      x.strokeRect(IX + i * IW / gx, IY + j * IH / gy, IW / gx, IH / gy);
    }
  }
